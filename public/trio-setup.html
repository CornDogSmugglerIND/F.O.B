<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0e1114" />
  <title>Trio Setup — Tonight</title>
  <style>
    :root {
      --bg: #0e1114;
      --panel: #1a2229;
      --text: #e8ecef;
      --muted: #8b98a5;
      --accent: #c9a227;
      --accent-text: #0e1114;
      --done: #1f8a4c;
      --border: #2a3540;
      --warn: #b45309;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding: 16px;
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
      line-height: 1.45;
    }
    .wrap { max-width: 440px; margin: 0 auto; }
    .eyebrow {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin: 0 0 6px;
    }
    h1 { font-size: 1.35rem; margin: 0 0 8px; font-weight: 700; }
    .sub { color: var(--muted); font-size: 0.95rem; margin: 0 0 16px; }
    .progress-wrap { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
    .bar { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .bar > span { display: block; height: 100%; background: var(--done); width: 0%; transition: width 0.2s ease; }
    .count { font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 16px;
      min-height: 280px;
    }
    .step-num {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
    }
    .card h2 { font-size: 1.15rem; margin: 0 0 10px; font-weight: 700; }
    .card p { margin: 0 0 12px; color: var(--text); font-size: 1rem; }
    .card ul { margin: 0 0 14px; padding-left: 1.15rem; color: var(--text); }
    .card li { margin-bottom: 8px; }
    .hint {
      font-size: 0.88rem;
      color: var(--muted);
      margin: 0 0 14px;
      padding: 10px 12px;
      background: rgba(0,0,0,0.25);
      border-radius: 10px;
      border-left: 3px solid var(--warn);
    }
    .link-box {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      align-items: stretch;
    }
    .link-box input {
      flex: 1;
      min-width: 0;
      background: #12171c;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      padding: 12px;
      font-size: 0.85rem;
    }
    .copy-btn, .nav-btn, .done-btn {
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 12px 14px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .copy-btn {
      background: #2a3540;
      color: var(--text);
      white-space: nowrap;
    }
    .copy-btn.ok { background: var(--done); }
    .nav {
      display: grid;
      grid-template-columns: 1fr 1.4fr;
      gap: 10px;
      margin-top: 16px;
    }
    .nav-btn { background: #2a3540; color: var(--text); }
    .nav-btn:disabled { opacity: 0.35; }
    .done-btn { background: var(--accent); color: var(--accent-text); }
    .done-btn:disabled { opacity: 0.35; }
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(20px + env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(120%);
      background: var(--done);
      color: #fff;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: transform 0.2s ease;
      z-index: 20;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .finish {
      text-align: center;
      padding: 24px 8px;
    }
    .finish h2 { margin-bottom: 10px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">Cursor + Claude + GitHub</p>
    <h1>Tonight setup</h1>
    <p class="sub">One step at a time. Do this at your desktop. Cursor will verify before saying it’s good.</p>
    <div class="hint" id="gates" style="margin-bottom:16px">
      <strong>Straight status:</strong><br />
      ✅ Claude product map on GitHub #24 — done<br />
      ❌ Composio tools on THIS cloud chat — not done yet<br />
      Until ❌ flips: not all-good. No app rebuild.
    </div>

    <div class="progress-wrap">
      <div class="bar"><span id="bar"></span></div>
      <div class="count" id="count">1 / 5</div>
    </div>

    <div class="card" id="card"></div>

    <div class="nav" id="nav">
      <button type="button" class="nav-btn" id="backBtn">Back</button>
      <button type="button" class="done-btn" id="nextBtn">Done — Next</button>
    </div>
  </div>

  <div class="toast" id="toast">Copied</div>

  <script>
    const STEPS = [
      {
        title: "What is going on (read this)",
        body: "Claude already answered GitHub #24. Last gate: THIS cloud agent must see Composio tools. That comes from Cursor’s web MCP dropdown — not from any repo file, and not from desktop .cursor/mcp.json.",
        bullets: [
          "Repo config will never fix this. Cloud Agents ignore .cursor/mcp.json.",
          "Do not open MCP URLs in Safari/Chrome — they look like junk query text.",
          "Cowork Triple Threat working ≠ this cloud box has Composio tools yet."
        ],
        copy: "https://app.composio.dev",
        copyLabel: "Open Composio (real page)",
        hint: "Next: copy the Triple Threat server URL from Composio, then paste it into Cursor Agents MCP."
      },
      {
        title: "Copy the Triple Threat MCP URL",
        body: "In Composio, open the MCP server named Triple Threat and copy its server URL. It often looks like https://mcp.composio.dev/... with a key in the URL.",
        bullets: [
          "app.composio.dev → MCP servers (or Install / connectors)",
          "Open the one named Triple Threat",
          "Copy the server URL (mcp.composio.dev/... — not a webpage to browse)",
          "If you only see connect.composio.dev/mcp, say so — we will use that with a header instead"
        ],
        copy: "https://app.composio.dev",
        copyLabel: "Open Composio again",
        hint: "Paste a screenshot description or the URL host (redact the key) if you are unsure which field to copy."
      },
      {
        title: "Paste into Cursor Agents MCP dropdown",
        body: "On cursor.com/agents, use the MCP dropdown at the TOP of the page. Add server → paste the Triple Threat URL → HTTP → Save/Enable.",
        bullets: [
          "Open https://cursor.com/agents (sign in as Sawyer)",
          "MCP dropdown at the TOP → Add server",
          "Paste the Triple Threat URL into the URL field only",
          "Transport: HTTP → Save / Enable",
          "Team/account level — applies to cloud agents, not a per-branch file"
        ],
        copy: "https://cursor.com/agents",
        copyLabel: "Open Cursor Agents (real page)",
        hint: "Backup: dashboard → Integrations & MCP. Still paste the Triple Threat URL there — do not invent a generic connect URL unless that is what Triple Threat shows."
      },
      {
        title: "Tell Cursor to verify",
        body: "After Save/Enable, come back to this chat and send one short message.",
        bullets: [
          "Type: composio done",
          "Or: list your available tools",
          "Cursor must see a Composio namespace before saying all-good",
          "No Scouter rebuild until that check passes"
        ],
        copy: "list your available tools",
        copyLabel: "Copy verify message",
        hint: "Issue #24 product map is already PASS. This step only closes the Composio-on-cloud-agent gate."
      }
    ];

    let i = 0;
    const card = document.getElementById("card");
    const bar = document.getElementById("bar");
    const count = document.getElementById("count");
    const backBtn = document.getElementById("backBtn");
    const nextBtn = document.getElementById("nextBtn");
    const toast = document.getElementById("toast");
    const nav = document.getElementById("nav");

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(showToast.t);
      showToast.t = setTimeout(() => toast.classList.remove("show"), 1600);
    }

    async function copyText(text, btn) {
      try {
        await navigator.clipboard.writeText(text);
        btn.classList.add("ok");
        btn.textContent = "Copied";
        showToast("Copied");
        setTimeout(() => {
          btn.classList.remove("ok");
          btn.textContent = "Copy";
        }, 1200);
      } catch {
        showToast("Long-press the box to copy");
      }
    }

    function render() {
      if (i >= STEPS.length) {
        const agentUrl = "https://cursor.com/agents/bc-01a060ac-33ae-742d-85d0-f7658f3af396";
        const checkMsg = "I'm home. Check now.";
        card.innerHTML = `
          <div class="finish">
            <h2>Tell Cursor to check</h2>
            <p>Message is copied. Open the agent chat and paste/send it.</p>
            <div class="link-box" style="max-width:100%;margin:14px auto">
              <input id="copyVal" readonly value="${checkMsg}" />
              <button type="button" class="copy-btn" id="copyBtn">Copy</button>
            </div>
            <p style="margin:14px 0 0">
              <a class="done-btn" id="openAgent" href="${agentUrl}" target="_blank" rel="noopener"
                 style="display:inline-block;text-decoration:none">Open Cursor agent</a>
            </p>
            <p class="sub">Stay at the desk until Cursor reports pass or fail.</p>
          </div>`;
        nav.classList.add("hidden");
        bar.style.width = "100%";
        count.textContent = `${STEPS.length} / ${STEPS.length}`;
        const btn = document.getElementById("copyBtn");
        btn.onclick = () => copyText(checkMsg, btn);
        copyText(checkMsg, btn);
        return;
      }

      const s = STEPS[i];
      card.innerHTML = `
        <div class="step-num">Step ${i + 1} of ${STEPS.length}</div>
        <h2>${s.title}</h2>
        <p>${s.body}</p>
        <ul>${s.bullets.map((b) => `<li>${b}</li>`).join("")}</ul>
        ${s.hint ? `<p class="hint">${s.hint}</p>` : ""}
        <label class="eyebrow" style="display:block;margin-bottom:6px">${s.copyLabel}</label>
        <div class="link-box">
          <input id="copyVal" readonly value="${s.copy.replaceAll('"', "&quot;")}" />
          <button type="button" class="copy-btn" id="copyBtn">Copy</button>
        </div>
      `;

      document.getElementById("copyBtn").onclick = () =>
        copyText(s.copy, document.getElementById("copyBtn"));

      backBtn.disabled = i === 0;
      nextBtn.textContent = i === STEPS.length - 1 ? "Finish" : "Done — Next";
      bar.style.width = `${((i) / STEPS.length) * 100}%`;
      count.textContent = `${i + 1} / ${STEPS.length}`;
      nav.classList.remove("hidden");
    }

    backBtn.onclick = () => {
      if (i > 0) {
        i -= 1;
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    };
    nextBtn.onclick = () => {
      i += 1;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
      if (i >= STEPS.length) {
        window.open(
          "https://cursor.com/agents/bc-01a060ac-33ae-742d-85d0-f7658f3af396",
          "_blank",
          "noopener"
        );
      }
    };

    render();
  </script>
</body>
</html>
