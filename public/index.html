<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#04070C" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Scouter</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/scouter.css?v=5" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="topbar-row">
        <div>
          <h1>Scouter</h1>
          <p>Mobile intake for Coalition</p>
        </div>
        <div class="stat-pill">
          <strong id="statCount">0</strong>
          <span>saved</span>
        </div>
      </div>
    </header>

    <div class="content">
      <section id="viewCapture" class="view active">
        <div class="intro">
          <h2>Add an item</h2>
          <p>Photos save on this phone first. Barcode lookup uses the network when available.</p>
        </div>

        <div class="card">
          <div class="card-title">Photos</div>
          <div class="dropzone" id="photoDrop">
            <div class="dropzone-title">Tap to add photos</div>
            <div class="dropzone-sub">Camera or gallery · HEIC supported</div>
          </div>
          <div class="thumbs" id="photoGrid"></div>
          <div class="row-2">
            <button type="button" class="btn" id="btnCamera">Camera</button>
            <button type="button" class="btn" id="btnGallery">Gallery</button>
          </div>
        </div>

        <div class="card">
          <div class="card-title">Identify</div>
          <div class="btn-row-3">
            <button type="button" class="btn" id="btnScan">Scan</button>
            <button type="button" class="btn" id="btnLookup">Lookup</button>
            <button type="button" class="btn" id="btnManual">Manual</button>
          </div>
          <div class="stack">
            <label class="label" for="barcodeInput">Barcode</label>
            <input class="input" id="barcodeInput" placeholder="Optional UPC / EAN" inputmode="numeric" autocomplete="off" />
          </div>
          <div class="stack hidden" id="manualRow">
            <label class="label" for="manualTitle">Title</label>
            <div class="row-2">
              <input class="input" id="manualTitle" placeholder="Product name" autocomplete="off" />
              <button type="button" class="btn" id="btnManualOk">Set</button>
            </div>
          </div>
          <div class="status" id="identifyStatus">Add a photo, barcode, or title to save</div>
        </div>

        <div class="card">
          <div class="card-title">Details</div>
          <div class="stack">
            <label class="label">Quantity</label>
            <div class="qty">
              <button type="button" id="qtyMinus">−</button>
              <output id="qtyVal">1</output>
              <button type="button" id="qtyPlus">+</button>
            </div>
          </div>
          <div class="stack">
            <label class="label">Category</label>
            <div class="chips" id="categoryChips"></div>
          </div>
          <div class="stack">
            <label class="label" for="fieldNotes">Notes</label>
            <textarea class="input" id="fieldNotes" placeholder="Optional" rows="2"></textarea>
          </div>
        </div>
      </section>

      <section id="viewCollection" class="view">
        <div id="collectionRoot"></div>
      </section>
    </div>

    <div class="savebar" id="saveBar">
      <button type="button" class="btn btn-primary" id="btnSave" disabled>Save item</button>
    </div>

    <nav class="tabs">
      <button type="button" class="tab active" data-view="capture">Capture</button>
      <button type="button" class="tab" data-view="collection">Collection</button>
    </nav>
  </div>

  <input type="file" id="inputCamera" accept="image/jpeg,image/png,image/webp,image/heic,image/heif,image/*" capture="environment" multiple hidden />
  <input type="file" id="inputGallery" accept="image/jpeg,image/png,image/webp,image/heic,image/heif,image/*" multiple hidden />

  <div class="scan-overlay" id="scanOverlay">
    <video id="scanVideo" playsinline muted autoplay></video>
    <button type="button" class="btn" id="btnScanClose">Cancel scan</button>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/lib/image.js?v=5"></script>
  <script src="/scouter.js?v=5"></script>
</body>
</html>
