<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0A0B0D" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Coalition H.U.D · Scouter</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/scouter.css?v=21" />
</head>
<body class="handheld">
  <div class="ambient" aria-hidden="true">
    <div class="ambient-orb ambient-orb-1"></div>
    <div class="ambient-orb ambient-orb-2"></div>
    <div class="ambient-orb ambient-orb-3"></div>
  </div>

  <div id="app" class="shell v-glass handheld-shell">
    <div class="v-sweep" aria-hidden="true"></div>

    <section id="viewCapture" class="view active handheld-scout">
      <header class="hh-top">
        <div class="hh-brand">
          <span class="hh-mark">SCOUTER</span>
          <span class="hh-sub v-label">Coalition H.U.D</span>
        </div>
        <div class="hh-pip" aria-live="polite">
          <span class="hh-pip-dot"></span>
          <span class="v-readout v-emit-gold" id="statCount">00</span>
        </div>
      </header>

      <button type="button" class="hh-viewfinder" id="btnCamera" aria-label="Take photo">
        <div class="hh-vf-frame" id="viewfinderFace">
          <div class="hh-reticle" aria-hidden="true">
            <span class="hh-corner hh-tl"></span>
            <span class="hh-corner hh-tr"></span>
            <span class="hh-corner hh-bl"></span>
            <span class="hh-corner hh-br"></span>
          </div>
          <div class="hh-vf-idle" id="viewfinderIdle">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
            <span class="v-label">Tap to shoot</span>
          </div>
          <img id="viewfinderPreview" class="hh-vf-preview hidden" alt="" />
        </div>
        <div class="hh-photo-strip no-scrollbar" id="photoGrid"></div>
        <span class="hh-photo-count v-label" id="photoCountLbl">0 photos</span>
      </button>

      <div class="hh-actions">
        <button type="button" class="hh-act hh-act-gold" id="btnShutter">
          <span class="hh-act-icon" aria-hidden="true">●</span>
          CAPTURE
        </button>
        <button type="button" class="hh-act" id="btnScan">
          <span class="hh-act-icon" aria-hidden="true">▥</span>
          SCAN
        </button>
      </div>

      <div class="hh-id">
        <div class="hh-id-row">
          <input class="m-input hh-barcode" id="barcodeInput" placeholder="UPC / EAN" inputmode="numeric" autocomplete="off" enterkeyhint="search" />
          <button type="button" class="m-btn m-btn-primary hh-lookup" id="btnLookup">ID</button>
        </div>
        <div class="status-strip" id="identifyStatus">Point camera · scan barcode · add item</div>
        <div class="hh-id-row hh-title-row" id="manualRow">
          <input class="m-input" id="manualTitle" placeholder="Title (if lookup misses)" autocomplete="off" />
          <button type="button" class="m-btn" id="btnManualOk">Set</button>
        </div>
      </div>

      <div class="hh-meta">
        <div class="qty-control">
          <button type="button" class="qty-btn" id="qtyMinus" aria-label="Decrease qty">−</button>
          <output class="qty-val" id="qtyVal">1</output>
          <button type="button" class="qty-btn" id="qtyPlus" aria-label="Increase qty">+</button>
        </div>
        <div class="chip-row no-scrollbar" id="categoryChips"></div>
      </div>

      <label class="hh-stage">
        <input type="checkbox" id="stagedFlag" checked />
        <span>STAGE for desktop</span>
      </label>

      <button type="button" class="m-btn m-btn-primary m-btn-cut-wide hh-commit" id="btnSave" disabled>Add to rail</button>

      <button type="button" class="hh-gallery" id="btnGallery">Add from gallery</button>
      <input type="hidden" id="fieldNotes" value="" />
      <button type="button" class="hidden" id="btnManual" tabindex="-1" aria-hidden="true"></button>
      <div class="hidden" id="pageHero"></div>
      <span class="hidden" id="pageTitle"></span>
      <span class="hidden" id="pageEyebrow"></span>
      <span class="hidden" id="pageSub"></span>
      <div class="hidden" id="photoDrop"></div>
      <div class="hidden" id="intakeBar"></div>
      <div class="hidden" id="railToolbar"></div>
      <div class="hidden" id="saveBar"></div>
      <button type="button" class="hidden" id="btnNewScan"></button>
      <button type="button" class="hidden" id="btnExport"></button>
      <button type="button" class="hidden" id="btnImport"></button>
      <input type="file" id="importFile" accept="application/json,.json" hidden />
    </section>

    <section id="viewCollection" class="view handheld-rail">
      <header class="hh-top">
        <div class="hh-brand">
          <span class="hh-mark">RAIL</span>
          <span class="hh-sub v-label">Sift · stage</span>
        </div>
        <button type="button" class="m-btn m-btn-primary" id="btnRailNew" style="padding:10px 14px;font-size:12px">New</button>
      </header>
      <div class="rail-search hh-rail-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="search" id="railFilter" placeholder="Filter rail" autocomplete="off" />
      </div>
      <div id="collectionRoot"></div>
    </section>

    <nav class="bottom-nav" aria-label="Scouter">
      <button type="button" class="nav-tab active" data-view="capture">
        <span class="nav-tab-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
        </span>
        Scout
      </button>
      <button type="button" class="nav-tab" data-view="collection">
        <span class="nav-tab-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M16.5 9.4l-9-5.19M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/></svg>
        </span>
        Rail
      </button>
    </nav>
  </div>

  <input type="file" id="inputCamera" accept="image/jpeg,image/png,image/webp,image/heic,image/heif,image/*" capture="environment" multiple hidden />
  <input type="file" id="inputGallery" accept="image/jpeg,image/png,image/webp,image/heic,image/heif,image/*" multiple hidden />

  <div class="scan-overlay" id="scanOverlay">
    <div id="scanReader" class="scan-reader"></div>
    <video id="scanVideo" playsinline muted autoplay hidden></video>
    <p class="scan-hint v-label">Align barcode in frame</p>
    <button type="button" class="m-btn" id="btnScanClose">Cancel</button>
  </div>

  <div class="drag-overlay" id="dragOverlay" aria-hidden="true">
    <div class="drag-overlay-inner">
      <svg class="drag-overlay-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      <div class="v-label drag-overlay-label">Release to intake</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/lib/html5-qrcode.min.js?v=21"></script>
  <script src="/lib/image.js?v=21"></script>
  <script src="/scouter.js?v=21"></script>
</body>
</html>
