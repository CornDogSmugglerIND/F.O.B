<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#04070C" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Scouter · Coalition</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/scouter.css?v=10" />
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <div class="ambient-orb ambient-orb-1"></div>
    <div class="ambient-orb ambient-orb-2"></div>
    <div class="ambient-orb ambient-orb-3"></div>
  </div>
  <div id="app" class="shell v-glass">
    <div class="v-sweep" aria-hidden="true"></div>
    <div class="corner-brackets" aria-hidden="true">
      <span class="corner corner-tl"></span>
      <span class="corner corner-tr"></span>
    </div>

    <div class="intake-shell">
      <div id="intakeBar" class="intake-bar v-panel v-cut-sm hidden">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFD98A" stroke-width="1.6"><path d="M16.5 9.4l-9-5.19M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><path d="M3.3 7l8.7 5 8.7-5M12 22V12"/></svg>
        <span class="v-label" style="font-size:9px">On rail</span>
        <div class="v-readout v-emit-gold" id="statCount">00</div>
      </div>

      <div id="railToolbar" class="rail-toolbar hidden">
        <div class="rail-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="search" id="railFilter" placeholder="Filter intake" autocomplete="off" />
        </div>
        <button type="button" class="m-btn m-btn-primary" id="btnNewScan">New scan</button>
      </div>

      <div class="page-hero" id="pageHero">
        <div class="hero-eyebrow">
          <svg class="hero-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
          <span class="v-label" id="pageEyebrow">Rail · Mobile intake</span>
        </div>
        <h1 class="v-title" id="pageTitle" style="font-size:28px;line-height:1.05;margin-top:6px">New scan</h1>
        <p class="hero-sub" id="pageSub">Capture photos and barcodes on this device. Items stay on your phone until Command Core sync.</p>
        <div class="gold-rule"></div>
      </div>

      <section id="viewCapture" class="view active">
        <div class="v-panel v-cut panel-block">
          <div class="panel-head">
            <h2 class="panel-title">Photos</h2>
            <span class="v-label" id="photoCountLbl">0 added</span>
          </div>
          <label class="photo-drop" id="photoDrop">
            <input type="file" id="photoDropInput" accept="image/jpeg,image/png,image/webp,image/heic,image/heif,image/*" multiple hidden />
            <div class="photo-drop-icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            </div>
            <div class="photo-drop-title">Drop a folder of scans</div>
            <div class="photo-drop-sub">or tap to browse · HEIC supported · auto-compressed</div>
          </label>
          <div class="photo-scroll no-scrollbar" id="photoGrid"></div>
          <div class="m-btn-row">
            <button type="button" class="m-btn" id="btnCamera">Camera</button>
            <button type="button" class="m-btn" id="btnGallery">Gallery</button>
          </div>
        </div>

        <div class="v-panel v-cut panel-block">
          <div class="panel-head">
            <h2 class="panel-title">Identify</h2>
          </div>
          <div class="m-btn-row-3">
            <button type="button" class="m-btn" id="btnScan">Scan</button>
            <button type="button" class="m-btn" id="btnLookup">Lookup</button>
            <button type="button" class="m-btn" id="btnManual">Manual</button>
          </div>
          <div class="field-stack">
            <label class="m-eyebrow" for="barcodeInput">Barcode</label>
            <input class="m-input w-full px-3 py-2.5" id="barcodeInput" placeholder="Scan or type UPC / EAN" inputmode="numeric" autocomplete="off" />
          </div>
          <div class="field-stack hidden" id="manualRow">
            <label class="m-eyebrow" for="manualTitle">Product title</label>
            <div class="m-btn-row">
              <input class="m-input w-full px-3 py-2.5" id="manualTitle" placeholder="Enter manually" autocomplete="off" />
              <button type="button" class="m-btn" id="btnManualOk">Set</button>
            </div>
          </div>
          <div class="status-strip" id="identifyStatus">Add a photo, barcode, or title to start intake</div>
        </div>

        <div class="v-panel v-cut panel-block">
          <div class="panel-head">
            <h2 class="panel-title">Item data</h2>
          </div>
          <div class="field-stack">
            <label class="m-eyebrow">Quantity</label>
            <div class="qty-control">
              <button type="button" class="qty-btn" id="qtyMinus">−</button>
              <output class="qty-val" id="qtyVal">1</output>
              <button type="button" class="qty-btn" id="qtyPlus">+</button>
            </div>
          </div>
          <div class="field-stack">
            <label class="m-eyebrow">Category</label>
            <div class="chip-row" id="categoryChips"></div>
          </div>
          <div class="field-stack">
            <label class="m-eyebrow" for="fieldNotes">Notes</label>
            <textarea class="m-input w-full px-3 py-2.5" id="fieldNotes" placeholder="Optional notes…" rows="2"></textarea>
          </div>
        </div>
      </section>

      <section id="viewCollection" class="view">
        <div id="collectionRoot"></div>
      </section>
    </div>

    <div class="save-dock" id="saveBar">
      <button type="button" class="m-btn m-btn-primary m-btn-cut-wide" id="btnSave" disabled>Start intake</button>
    </div>

    <nav class="bottom-nav">
      <button type="button" class="nav-tab" data-view="collection">
        <span class="nav-tab-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M16.5 9.4l-9-5.19M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/></svg>
        </span>
        Intake
      </button>
      <button type="button" class="nav-tab active" data-view="capture">
        <span class="nav-tab-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
        </span>
        Scan
      </button>
    </nav>
  </div>

  <input type="file" id="inputCamera" accept="image/jpeg,image/png,image/webp,image/heic,image/heif,image/*" capture="environment" multiple hidden />
  <input type="file" id="inputGallery" accept="image/jpeg,image/png,image/webp,image/heic,image/heif,image/*" multiple hidden />

  <div class="scan-overlay" id="scanOverlay">
    <div id="scanReader" class="scan-reader"></div>
    <video id="scanVideo" playsinline muted autoplay hidden></video>
    <p class="scan-hint v-label">Align barcode in frame</p>
    <button type="button" class="m-btn" id="btnScanClose">Cancel</button>
  </div>

  <div class="drag-overlay" id="dragOverlay" aria-hidden="true">
    <div class="drag-overlay-inner">
      <svg class="drag-overlay-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      <div class="v-label drag-overlay-label">Release to intake</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/lib/html5-qrcode.min.js?v=10"></script>
  <script src="/lib/image.js?v=10"></script>
  <script src="/scouter.js?v=10"></script>
</body>
</html>
