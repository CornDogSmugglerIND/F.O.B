<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>F.O.B</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="card">
      <header>
        <h1>F.O.B</h1>
        <p class="subtitle">A minimal Express starter, running in a Cloud Agent environment.</p>
        <span id="health" class="badge badge--pending">checking…</span>
      </header>

      <section class="demo">
        <label for="text">Try the API</label>
        <div class="row">
          <input id="text" type="text" placeholder="Type something…" value="Hello, F.O.B" />
          <button id="send" type="button">Reverse</button>
        </div>
        <pre id="result" class="result" aria-live="polite">Response will appear here.</pre>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
