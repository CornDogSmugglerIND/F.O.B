<!doctype html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#1D1D1B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3">
<link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png?v=3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Coalition">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="stylesheet" href="channels.css?v=3">
<link rel="stylesheet" href="settings.css?v=3">
</head>
<body>
<div class="smoke l" aria-hidden="true"></div><div class="smoke r" aria-hidden="true"></div>
<div class="hud-scan" aria-hidden="true"></div>
<div class="hud-frame" aria-hidden="true"><i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i></div>

<header class="top" id="top">
  <a class="brand" href="./" aria-label="CornDogSmuggler Coalition, home">
    <img class="brand-icon" src="img/icon.jpg?v=3" alt="">
    <span class="brand-name">CornDogSmuggler<small>Coalition.</small></span>
  </a>
  <div class="stats" id="stats"></div>
  <span class="link" id="link"><span>EBAY OFFLINE</span></span>
  <button class="syncbtn" id="syncBtn" aria-label="Sync with eBay">Sync</button>
  <button class="avatar" id="avatarBtn" aria-label="Profile picture. Tap to change"><img id="avatarImg" src="img/husky.jpg" alt=""></button>
  <input type="file" id="avatarFile" accept="image/*" hidden>
</header>

<nav class="nav" id="nav" aria-label="Main">
  <button data-view="command" class="on"><i><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.2"/><path d="M12 2.5v3.5M12 18v3.5M2.5 12H6M18 12h3.5"/></svg></i>Command</button>
  <button data-view="scouter"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"/><path d="M7.5 12h9"/></svg></i>Scouter</button>
  <button data-view="collection"><i><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="3.5" width="11" height="15" rx="2"/><path d="M5 7.5v11a2 2 0 0 0 2 2h8"/></svg></i>Collection</button>
  <button data-view="channels"><i><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="1.8"/><path d="M8 8a5.7 5.7 0 0 0 0 8M16 8a5.7 5.7 0 0 1 0 8M5 5a10 10 0 0 0 0 14M19 5a10 10 0 0 1 0 14"/></svg></i>Channels</button>
  <button data-view="spaces"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg></i>Spaces</button>
  <button data-view="settings"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></i>Settings</button>
</nav>

<main id="main"></main>

<div class="sheet-back" id="sheetBack" hidden></div>
<aside class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="next.js?v=30" type="module"></script>
</body>
</html>
