<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>F.O.B</title><link rel="icon" href="/next/img/wm-glyph.png">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;
 background:#05100C;color:#EAFFF4;font:400 16px/1.5 ui-rounded,"SF Pro Rounded",system-ui,sans-serif;
 background-image:radial-gradient(900px 600px at 20% 10%,rgba(125,242,180,.12),transparent 60%),radial-gradient(700px 500px at 85% 80%,rgba(240,160,96,.09),transparent 60%)}
.box{width:100%;max-width:330px;text-align:center}
img{width:76px;height:76px;object-fit:contain;filter:drop-shadow(0 0 22px rgba(125,242,180,.5))}
h1{margin:16px 0 4px;font-size:21px;font-weight:800;letter-spacing:.2px}
p{margin:0 0 22px;color:#8b9c94;font-size:14px}
input{width:100%;height:52px;padding:0 16px;border-radius:15px;text-align:center;letter-spacing:.14em;
 font:600 17px ui-rounded,system-ui,sans-serif;color:#EAFFF4;background:rgba(0,0,0,.45);
 border:1px solid rgba(125,242,180,.3);outline:none;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:#7DF2B4;box-shadow:0 0 0 4px rgba(125,242,180,.14)}
button{width:100%;height:50px;margin-top:11px;border:0;border-radius:15px;cursor:pointer;
 font:700 16px ui-rounded,system-ui,sans-serif;color:#05100C;
 background:linear-gradient(180deg,#9CFFCB,#59D99A);box-shadow:0 8px 26px rgba(125,242,180,.26);
 transition:transform .15s,filter .2s}
button:active{transform:scale(.98)}button:disabled{filter:grayscale(.6);cursor:default}
.err{margin-top:12px;min-height:19px;font-size:13.5px;color:#F0A060}
</style></head><body>
<form class="box" id="f">
  <img src="/next/img/wm-glyph.png" alt="">
  <h1>Coalition F.O.B</h1>
  <p>Private. Enter your password.</p>
  <input id="c" type="password" inputmode="text" autocomplete="current-password" placeholder="Password" autofocus aria-label="Password">
  <button id="b" type="submit">Unlock</button>
  <div class="err" id="e" role="status"></div>
</form>
<script>
var f=document.getElementById('f'),c=document.getElementById('c'),b=document.getElementById('b'),e=document.getElementById('e');
f.addEventListener('submit',async function(ev){ev.preventDefault();if(!c.value)return;
 b.disabled=true;b.textContent='Checking…';e.textContent='';
 try{var r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:c.value})});
  if(r.ok){b.textContent='Opening…';location.replace('/next/');return}
  e.textContent='That password is wrong.';}catch(x){e.textContent='Could not reach the server.';}
 b.disabled=false;b.textContent='Unlock';c.select();});
</script></body></html>
