name: Claude PR Review

# Automatic: runs on every PR — no @claude mention required.
# Skips cleanly until the Claude GitHub App + ANTHROPIC_API_KEY are configured.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Check Claude is configured
        id: config
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Claude review — add ANTHROPIC_API_KEY and install https://github.com/apps/claude"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.config.outputs.configured == 'true'
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        if: steps.config.outputs.configured == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for the Scouter mobile intake scanner (Node/Express, vanilla JS frontend).

            Focus on:
            1. Correctness — barcode scan, photo upload, API handlers, mobile Safari compatibility
            2. Security — input validation, file upload limits, path traversal
            3. Tests — whether changes need test coverage (`npm test`)
            4. Regressions — PWA behavior, Vercel serverless routing

            If you find fixable issues, push commits to this branch.
            Otherwise leave a concise review comment summarizing findings.
          claude_args: |
            --max-turns 15
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(npm:*),Bash(node:*)"
