name: Claude PR Review

# Automatic Claude review on every PR.
# Auth key is trimmed (trailing newlines break Anthropic).
# Job never blocks the pipeline if Claude itself errors.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Check Claude is configured
        id: config
        env:
          RAW_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          KEY=$(printf '%s' "$RAW_KEY" | tr -d '\r\n')
          if [ -z "$KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Claude review — ANTHROPIC_API_KEY missing"
            exit 0
          fi
          echo "ANTHROPIC_API_KEY=$KEY" >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        if: steps.config.outputs.configured == 'true'
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        if: steps.config.outputs.configured == 'true'
        with:
          anthropic_api_key: ${{ env.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for Scouter / F.O.B (Node/Express, vanilla JS).

            Focus on correctness, security, tests, and regressions.
            If you find fixable issues, push commits. Otherwise leave a short review comment.
          claude_args: |
            --max-turns 15
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(npm:*),Bash(node:*)"
