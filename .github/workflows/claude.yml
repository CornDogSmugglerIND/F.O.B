name: Claude Code

# Interactive: comment @claude on an issue or PR.
# Auth: CLAUDE_CODE_OAUTH_TOKEN (claude setup-token). API key only if CLAUDE_FORCE_API_KEY=true.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Check Claude is configured
        id: config
        env:
          RAW_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          FORCE_API: ${{ secrets.CLAUDE_FORCE_API_KEY }}
          RAW_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          OAUTH=$(printf '%s' "$RAW_OAUTH" | tr -d '\r\n')
          FORCE=$(printf '%s' "$FORCE_API" | tr -d '\r\n' | tr '[:upper:]' '[:lower:]')
          KEY=$(printf '%s' "$RAW_KEY" | tr -d '\r\n')
          # OAuth first. Console API key is known-broken (is_error/billing) unless forced.
          if [ -n "$OAUTH" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN=$OAUTH" >> "$GITHUB_ENV"
            echo "auth=oauth" >> "$GITHUB_OUTPUT"
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$FORCE" = "true" ] && [ -n "$KEY" ]; then
            echo "ANTHROPIC_API_KEY=$KEY" >> "$GITHUB_ENV"
            echo "auth=api_key" >> "$GITHUB_OUTPUT"
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "auth=none" >> "$GITHUB_OUTPUT"
          echo "::notice::Skipping — add CLAUDE_CODE_OAUTH_TOKEN (claude setup-token). API key disabled unless CLAUDE_FORCE_API_KEY=true."

      - uses: actions/checkout@v6
        if: steps.config.outputs.configured == 'true'
        with:
          fetch-depth: 1

      - name: Claude via OAuth token
        if: steps.config.outputs.auth == 'oauth'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ env.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "cursor"
          claude_args: |
            --max-turns 20
            --allowedTools "Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(npm:*),Bash(node:*),Bash(gh:*)"

      - name: Claude via API key
        if: steps.config.outputs.auth == 'api_key'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ env.ANTHROPIC_API_KEY }}
          allowed_bots: "cursor"
          claude_args: |
            --max-turns 20
            --allowedTools "Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(npm:*),Bash(node:*),Bash(gh:*)"
